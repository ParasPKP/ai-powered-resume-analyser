# Server port
server.port=8080

# Groq AI API Keys - loaded from .env file (DO NOT hardcode keys here)
groq.api.keys=${GROQ_API_KEY01},${GROQ_API_KEY02},${GROQ_API_KEY03}

# Groq API URL
groq.api.url=https://api.groq.com/openai/v1/chat/completions

# Groq Model
groq.model=llama-3.3-70b-versatile

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS - allow frontend dev server
cors.allowed-origins=http://localhost:4000,http://localhost:3000,http://localhost:5173

# Logging
logging.level.com.resumeanalyzer=DEBUG

# Load .env file
spring.config.import=optional:file:.env[.properties]
